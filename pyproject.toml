[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Calister Nnona", email = "calisternnona@gmail.com"}]
name = "cortec"
version = "1.2.5"
description = "A differentially private release for synthetic tabular data, decodable by any generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# scikit-learn is used by the hybrid's correction and by the evaluator; the vendor SDKs are extras.
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.60"]
gemini = ["google-genai>=1.0"]
# Enterprise surfaces: the same SDKs, plus request signing for Bedrock.
bedrock = ["anthropic[bedrock]>=0.40"]
azure = ["openai>=1.60"]
vertex = ["google-genai>=1.0"]
ollama = ["httpx>=0.27"]
# Decoding a release with no language model (`cortec decode`): private-pgm's estimator, which needs JAX.
pgm = ["mbi>=1.1,<2", "jax>=0.4", "jaxlib>=0.4"]
dev = ["pytest>=7"]

# Each console script prints its help page (`cortec --help`, `cortec <name>`) and runs the pipeline
# (`cortec run`, `cortec-hybrid run`); the audit checks that every declared entry point resolves.
[project.scripts]
cortec = "cortec.__main__:main"
cortec-hybrid = "cortec_hybrid.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cortec*", "cortec_hybrid*"]
